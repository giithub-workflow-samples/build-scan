name: Publish Scan Results

on:
  workflow_run:
    workflows: ["Black Duck SCA Build Scan"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and process scan logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          STATUS: ${{ github.event.workflow_run.conclusion }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          mkdir -p execution-logs/logs
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          gh api repos/${{ github.repository }}/actions/runs/${RUN_ID}/logs > /tmp/logs.zip
          unzip -o /tmp/logs.zip -d execution-logs/logs/

          if [ "$STATUS" = "success" ]; then
            STATUS_ICON="✅"; STATUS_LABEL="success"
          else
            STATUS_ICON="❌"; STATUS_LABEL="$STATUS"
          fi

          # Write Job Summary
          cat >> $GITHUB_STEP_SUMMARY << SUMMARY
          ## Black Duck SCA Scan Results

          | | |
          |---|---|
          | **Run** | [#${RUN_NUMBER}](${RUN_URL}) |
          | **Status** | ${STATUS_ICON} ${STATUS_LABEL} |
          | **Timestamp** | ${TIMESTAMP} |

          ### Log Files
          SUMMARY

          find execution-logs/logs -type f | sort | while read f; do
            name=$(basename "$f")
            echo "- \`${name}\`" >> $GITHUB_STEP_SUMMARY
          done

      - name: Commit and push execution logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add execution-logs/
          git diff --staged --quiet || git commit -m "Update execution logs for run #${{ github.event.workflow_run.run_number }}"
          git push
