name: Publish Scan Results

on:
  workflow_run:
    workflows: ["Black Duck SCA Build Scan"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download and generate results page
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          STATUS: ${{ github.event.workflow_run.conclusion }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          REPO: ${{ github.repository }}
          PAGES_URL: https://giithub-workflow-samples.github.io/build-scan/execution-logs/
        run: |
          mkdir -p execution-logs
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          export TIMESTAMP

          gh api repos/${REPO}/actions/runs/${RUN_ID}/logs > /tmp/logs.zip
          unzip -o /tmp/logs.zip -d /tmp/logs/

          python3 << 'PYEOF'
          import os, glob, html, re

          run_url    = os.environ['RUN_URL']
          status     = os.environ['STATUS']
          run_number = os.environ['RUN_NUMBER']
          timestamp  = os.environ['TIMESTAMP']
          pages_url  = os.environ['PAGES_URL']

          log_files = sorted(glob.glob('/tmp/logs/**/*.txt', recursive=True))

          status_color = '#2ea043' if status == 'success' else '#da3633'
          status_icon  = '✅' if status == 'success' else '❌'

          def colorize(line):
              e = html.escape(line)
              if re.search(r'ERROR|FAIL(ED)?|Exception', line, re.IGNORECASE):
                  return f'<span class="err">{e}</span>'
              if re.search(r'WARN(ING)?', line, re.IGNORECASE):
                  return f'<span class="wrn">{e}</span>'
              if re.search(r'SUCCESS|PASSED|COMPLETE', line, re.IGNORECASE):
                  return f'<span class="ok">{e}</span>'
              return f'<span class="inf">{e}</span>'

          sections = ''
          for i, fpath in enumerate(log_files):
              fname = os.path.basename(fpath)
              try:
                  with open(fpath, 'r', errors='replace') as f:
                      lines = f.readlines()
              except Exception:
                  continue
              has_errors = any(re.search(r'ERROR|FAIL(ED)?', l, re.IGNORECASE) for l in lines)
              badge      = '<span class="fb err-b">Errors</span>' if has_errors else '<span class="fb ok-b">OK</span>'
              open_attr  = 'open' if (has_errors or i == 0) else ''
              body       = '
'.join(colorize(l.rstrip()) for l in lines)
              sections  += f'''
          <details {open_attr}>
            <summary><span class="fname">{html.escape(fname)}</span>{badge}</summary>
            <pre class="log">{body}</pre>
          </details>'''

          page = f'''<!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Scan Results — Run #{run_number}</title>
            <style>
              *{{box-sizing:border-box;margin:0;padding:0}}
              body{{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}}
              .hdr{{background:#161b22;border-bottom:1px solid #30363d;padding:14px 24px;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;flex-wrap:wrap}}
              .hdr h1{{font-size:16px;font-weight:600;color:#f0f6fc;white-space:nowrap}}
              .status{{padding:3px 12px;border-radius:20px;font-size:13px;font-weight:600;color:#fff;background:{status_color}}}
              .meta{{display:flex;gap:20px;font-size:12px;color:#8b949e;margin-left:auto;flex-wrap:wrap}}
              .meta a{{color:#58a6ff;text-decoration:none}}
              .meta a:hover{{text-decoration:underline}}
              .wrap{{padding:20px 24px;max-width:1400px;margin:0 auto}}
              details{{background:#161b22;border:1px solid #30363d;border-radius:6px;margin-bottom:10px;overflow:hidden}}
              summary{{padding:10px 14px;cursor:pointer;font-size:13px;font-weight:600;color:#f0f6fc;display:flex;align-items:center;gap:8px;user-select:none}}
              summary::-webkit-details-marker{{display:none}}
              summary::before{{content:"▶";font-size:10px;color:#8b949e;transition:transform .15s;flex-shrink:0}}
              details[open] summary::before{{transform:rotate(90deg)}}
              .fname{{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
              .fb{{padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;flex-shrink:0}}
              .err-b{{background:#da3633;color:#fff}}
              .ok-b{{background:#238636;color:#fff}}
              .log{{padding:14px 16px;font-family:"SFMono-Regular",Consolas,monospace;font-size:12px;line-height:1.65;overflow-x:auto;white-space:pre-wrap;word-break:break-all;border-top:1px solid #30363d;background:#0d1117}}
              .err{{color:#ff7b72}}
              .wrn{{color:#e3b341}}
              .ok{{color:#3fb950}}
              .inf{{color:#8b949e}}
            </style>
          </head>
          <body>
            <div class="hdr">
              <h1>⚫ Black Duck SCA — Scan Results</h1>
              <span class="status">{status_icon} {status}</span>
              <div class="meta">
                <span>Run <a href="{run_url}">#{run_number}</a></span>
                <span>{timestamp}</span>
                <a href="{run_url}">View on GitHub Actions →</a>
              </div>
            </div>
            <div class="wrap">{sections}</div>
          </body>
          </html>'''

          with open('execution-logs/index.html', 'w') as f:
              f.write(page)
          print(f'Generated index.html with {len(log_files)} log sections')
          PYEOF

      - name: Write Job Summary
        env:
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          STATUS: ${{ github.event.workflow_run.conclusion }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          PAGES_URL: https://giithub-workflow-samples.github.io/build-scan/execution-logs/
        run: |
          [ "$STATUS" = "success" ] && ICON="✅" || ICON="❌"
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          cat >> $GITHUB_STEP_SUMMARY << EOF
          ## Black Duck SCA Scan Results

          | | |
          |---|---|
          | **Run** | [#${RUN_NUMBER}](${RUN_URL}) |
          | **Status** | ${ICON} ${STATUS} |
          | **Timestamp** | ${TIMESTAMP} |
          | **Full Results** | [View Execution Logs](${PAGES_URL}) |
          EOF

      - name: Commit and push execution logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add execution-logs/
          git diff --staged --quiet || git commit -m "Update execution logs for run #${{ github.event.workflow_run.run_number }}"
          git push
